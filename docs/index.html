<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reserve Lens</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eef0;color:#101820;font:16px Arial}button,input{font:inherit}header{display:flex;justify-content:space-between;padding:20px 4vw;font:700 12px monospace}.stage{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden}.aperture{width:min(75vw,700px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(#143b50 0 30deg,#e69b32 30deg 60deg);display:grid;place-items:center;animation:iris 8s ease-in-out infinite alternate;box-shadow:0 0 0 30px #cdd7da,0 0 0 32px #143b50}@keyframes iris{to{transform:rotate(18deg)}}.disc{width:48%;aspect-ratio:1;border-radius:50%;background:#f8faf6;display:grid;place-items:center;text-align:center;box-shadow:0 0 50px #0006}.disc h1{font:900 clamp(2rem,6vw,5rem)/.85 Arial Black;margin:0}.disc b{font:900 2rem monospace;color:#e25f32}.dock{position:absolute;bottom:4vh;display:flex;gap:8px}.dock button{border:0;background:#101820;color:white;padding:12px}.panel{position:fixed;inset:5vh 5vw;background:#fff;padding:28px;z-index:5;transform:translateY(110%);transition:.35s;overflow:auto}.panel.open{transform:none}.panel h2{font:900 4rem Arial Black;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:5px}.field input{padding:11px;border:0;border-bottom:2px solid}.sources{grid-column:1/-1;border:1px dashed;padding:12px}.go{background:#e69b32;border:0;padding:13px;font-weight:bold;margin-top:15px}.readback{padding:8vh 5vw;background:#143b50;color:white}.reader{display:flex}.reader input{flex:1;padding:12px}.reader button{background:#e69b32;border:0}.status{color:#ffc66b;font:12px monospace}pre{white-space:pre-wrap;background:#092332;padding:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}.sources{grid-column:auto}.panel h2{font-size:2.5rem}}</style></head><body><header><b>RESERVE LENS / OPTICAL COVERAGE</b><button id="connect">CONNECT</button></header><main class="stage"><div class="aperture" id="aperture"><div class="disc" id="ledgerDisc"><div><small id="state">NO EPOCH</small><h1 id="ratio">—</h1><b>BPS</b></div></div></div><div class="dock"><button id="registerOpen">CUT A NEW LENS</button><button id="observeOpen">ALIGN REPORTS</button></div></main><section class="readback"><div class="reader"><input id="active" placeholder="Lens ID"><button id="read">FOCUS</button></div><p class="status" id="status">STUDIONET CONTRACT LIVE</p><pre id="record">No lens focused.</pre></section><section class="panel" id="registerPanel"><button class="close">×</button><h2>Calibrate authority.</h2><form id="registerForm"><div class="grid"><div class="field"><label>LENS ID</label><input id="id" required></div><div class="field"><label>METRIC LABEL</label><input id="label" required></div><div class="field"><label>MINIMUM BASIS POINTS</label><input id="minimum" type="number" value="12000"></div><details class="sources"><summary>FREEZE TWO AUTHORITY ORIGINS</summary><div class="field"><input id="assetAuthority" type="url" required placeholder="Asset authority URL"></div><div class="field"><input id="liabilityAuthority" type="url" required placeholder="Liability authority URL"></div></details></div><button class="go">REGISTER LENS</button></form></section><section class="panel" id="observePanel"><button class="close">×</button><h2>Merge the ledgers.</h2><form id="observeForm"><div class="grid"><div class="field"><label>EPOCH</label><input id="epoch" type="number" min="1" required></div><details class="sources" open><summary>SELECT REPORTS FROM FROZEN ORIGINS</summary><div class="field"><input id="assets" type="url" required placeholder="Asset report"></div><div class="field"><input id="liabilities" type="url" required placeholder="Liability report"></div></details></div><button class="go">OBSERVE EPOCH</button></form></section><script type="module">import{createClient}from'https://esm.sh/genlayer-js@1.1.8';import{studionet}from'https://esm.sh/genlayer-js@1.1.8/chains';const $=s=>document.querySelector(s),ADDRESS='0xE51dbA6168A1B87001dA65994e7E2873caa33707';let client;const open=id=>$(id).classList.add('open'),close=()=>document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open')),status=t=>$('#status').textContent=t;async function connect(){const[a]=await ethereum.request({method:'eth_requestAccounts'});client=createClient({chain:studionet,account:a,provider:ethereum});await client.connect('studionet')}async function read(){if(!client)await connect();const x=await client.readContract({address:ADDRESS,functionName:'get_lens',args:[$('#active').value]});$('#record').textContent=JSON.stringify(x,(_,v)=>typeof v==='bigint'?v.toString():v,2);$('#ratio').textContent=x.ratio_bps;$('#state').textContent=x.state}async function write(fn,args){if(!client)await connect();const h=await client.writeContract({address:ADDRESS,functionName:fn,args,value:0n});status('WAITING FINALIZED');await client.waitForTransactionReceipt({hash:h,status:'FINALIZED',retries:180,interval:5000});status('FINALIZED '+h);await read()}$('#connect').onclick=connect;$('#registerOpen').onclick=()=>open('#registerPanel');$('#observeOpen').onclick=()=>open('#observePanel');document.querySelectorAll('.close').forEach(b=>b.onclick=close);$('#registerForm').onsubmit=e=>{e.preventDefault();$('#active').value=$('#id').value;write('register',[$('#id').value,$('#label').value,$('#assetAuthority').value,$('#liabilityAuthority').value,Number($('#minimum').value)]).then(close)};$('#observeForm').onsubmit=e=>{e.preventDefault();write('observe',[$('#active').value,Number($('#epoch').value),$('#assets').value,$('#liabilities').value]).then(close)};$('#read').onclick=read;</script></body></html>
